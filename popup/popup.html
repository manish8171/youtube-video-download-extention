<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="popup-header">
    <div class="brand">
      <img src="../icons/icon48.png" alt="Logo">
      <h1>YT Downloader</h1>
    </div>
    <span class="version-badge">v1.0</span>
  </header>

  <!-- Status Alert Banner -->
  <div id="statusMsg" class="status-msg"></div>

  <!-- Active Video Info Card -->
  <section class="video-card">
    <div id="noVideoState" class="no-video">
      <svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
      <span>Open a YouTube video to download MP4 or MP3</span>
    </div>

    <div id="activeVideoState" class="video-info" style="display: none;">
      <div class="thumbnail-wrapper">
        <img id="videoThumb" src="" alt="Thumbnail">
      </div>
      <div class="video-details">
        <div id="videoTitle" class="video-title">YouTube Video Title</div>
        <div id="videoChannel" class="video-channel">YouTube Channel</div>
      </div>
    </div>
  </section>

  <!-- Options & Action Buttons -->
  <section class="controls-section">
    <div class="format-group">
      <label for="qualitySelect" class="label">Video Quality (MP4)</label>
      <div class="select-wrapper">
        <select id="qualitySelect">
          <option value="best" selected>Best Available (Max HD)</option>
          <option value="1080">1080p Full HD</option>
          <option value="720">720p HD</option>
          <option value="480">480p SD</option>
          <option value="360">360p Low</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
    </div>

    <div class="action-buttons">
      <button id="downloadMp4Btn" class="btn-primary" disabled>
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span>Video (MP4)</span>
      </button>

      <button id="downloadMp3Btn" class="btn-secondary" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>Audio (MP3)</span>
      </button>
    </div>

    <!-- Shown only while a transfer is running; see applyState in popup.js -->
    <button id="cancelBtn" class="btn-cancel" hidden>
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      <span>Cancel Download</span>
    </button>
  </section>

  <!-- Download History -->
  <section class="history-section">
    <div class="history-header">
      <span class="label">Recent Downloads</span>
      <button id="clearHistoryBtn" class="clear-btn">Clear</button>
    </div>
    <div id="historyList" class="history-list">
      <div class="empty-history">No recent downloads</div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
